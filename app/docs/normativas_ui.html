<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normativas</title>
<!-- Ventana «Normativas de diseño» (normativas_dialog.py). SIN textos propios:
     todo llega traducido en estado.t desde Python. Diseño SOBRIO (pedido del
     usuario 2026-10-02: «mucho floro»): una fila por regla con interruptor,
     valor y estado; lo demás, en «Detalles». Accesible: teclado completo,
     role="switch", aria-expanded, región aria-live, foco visible, A− / A+. -->
<style>
  :root { --fs: 17px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: var(--fs)/1.45 "Segoe UI", system-ui, sans-serif; background: var(--window); color: var(--text);
         display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; padding: .8rem 1.2rem;
           background: var(--header); border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 1.3em; flex: 1; min-width: 10em; }
  .btn { background: var(--surface_alt); border: 1px solid var(--border); border-radius: 8px;
         padding: .4em .85em; cursor: pointer; min-height: 2.3em; }
  .btn:hover { background: var(--hover); }
  .btn.prim { background: var(--accent); color: var(--text_on_accent); border-color: var(--accent); }
  .btn.prim:hover { background: var(--accent_hover); }
  .btn.peligro:hover { background: var(--danger); color: #fff; }
  .barra { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: .6rem 1.2rem;
           border-bottom: 1px solid var(--border_soft); color: var(--text_muted); }
  .barra b.mal { color: var(--danger); }
  .barra input { flex: 1; min-width: 12em; max-width: 26em; background: var(--input_bg); border: 1px solid var(--border);
                 border-radius: 8px; padding: .35em .7em; }
  .aviso { margin: .6rem 1.2rem 0; padding: .5rem .8rem; border-left: 4px solid var(--danger);
           background: var(--surface_alt); border-radius: 6px; }

  .cuerpo { flex: 1; display: flex; min-height: 0; }
  nav { width: 14em; flex: none; padding: .8rem; border-right: 1px solid var(--border_soft); overflow: auto; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav button { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: .5em .65em;
               cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: .5em; }
  nav button:hover { background: var(--hover); }
  nav button[aria-current="true"] { background: var(--surface_alt); font-weight: 600; box-shadow: inset 4px 0 0 var(--accent); }
  .num { min-width: 1.7em; text-align: center; border-radius: 999px; padding: 0 .45em; background: var(--border_soft); font-size: .85em; }
  .num.mal { background: var(--danger); color: #fff; }
  main { flex: 1; overflow: auto; padding: .8rem 1.2rem 2rem; }
  main h2 { margin: .2rem 0 .6rem; font-size: 1.15em; }
  main h3 { margin: 1rem 0 .3rem; font-size: .95em; color: var(--text_muted); text-transform: uppercase; letter-spacing: .04em; }

  .fila { border-bottom: 1px solid var(--border_soft); }
  .linea { display: flex; align-items: center; gap: .8rem; padding: .45rem .2rem; }
  .linea .tit { flex: 1; min-width: 0; }
  .linea .val { color: var(--text_muted); white-space: nowrap; }
  .off .tit, .off .val { opacity: .6; }
  .chip { font-size: .8em; border-radius: 999px; padding: .05em .6em; white-space: nowrap; border: 1px solid var(--border); }
  .chip.ok { color: var(--success); border-color: var(--success); }
  .chip.mal { background: var(--danger); color: #fff; border-color: var(--danger); }
  .chip.rev { background: #f5aa14; color: #111; border-color: #f5aa14; }
  .chip.gris { color: var(--text_muted); }
  .mas { background: none; border: 1px solid transparent; border-radius: 8px; cursor: pointer; padding: .2em .5em; color: var(--text_muted); }
  .mas:hover { border-color: var(--border); color: var(--text); }

  .switch { display: inline-flex; align-items: center; background: none; border: 0; cursor: pointer; padding: .2em; flex: none; }
  .switch .pista { width: 2.8em; height: 1.55em; border-radius: 999px; background: var(--border); position: relative; transition: background .15s; }
  .switch .pista::after { content: ""; position: absolute; top: .18em; left: .18em; width: 1.2em; height: 1.2em; border-radius: 50%;
                          background: #fff; transition: left .15s; box-shadow: 0 1px 3px #0006; }
  .switch[aria-checked="true"] .pista { background: var(--success); }
  .switch[aria-checked="true"] .pista::after { left: 1.42em; }

  .det { padding: .3rem .4rem .9rem 3.6rem; display: grid; gap: .7rem; }
  .det p { margin: 0; }
  .det .lbl { font-weight: 600; }
  .det .mut { color: var(--text_muted); font-size: .92em; }
  .det ul { margin: .1rem 0 0; padding-left: 1.1rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: .25rem; }
  .fila2 { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; margin: 0 0 .4rem; padding: 0; }
  .chips li { display: inline-flex; align-items: center; gap: .2em; background: var(--surface_alt); border: 1px solid var(--border);
              border-radius: 999px; padding: .1em .2em .1em .7em; }
  .chips button { background: none; border: 0; cursor: pointer; border-radius: 50%; width: 1.6em; height: 1.6em; }
  .chips button:hover { background: var(--danger); color: #fff; }
  input[type=number] { width: 7em; background: var(--input_bg); border: 1px solid var(--border); border-radius: 8px; padding: .3em .5em; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg label { padding: .25em .8em; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--text_on_accent); }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: -3px; }
  .checks label { display: inline-flex; align-items: center; gap: .35em; margin-right: .9em; cursor: pointer; }
  input[type=checkbox] { width: 1.15em; height: 1.15em; accent-color: var(--accent); }
  .err { color: var(--danger); font-weight: 600; }
  .inc { display: flex; gap: .8rem; align-items: center; justify-content: space-between; padding: .4rem 0;
         border-bottom: 1px solid var(--border_soft); }
  .vacio { color: var(--text_muted); padding: 1rem 0; }
</style>
</head>
<body>
<header>
  <h1 id="titulo"></h1>
  <button class="btn" id="btnImportar" type="button"></button>
  <button class="btn" id="btnExportar" type="button"></button>
  <button class="btn" id="menos" type="button">A−</button>
  <button class="btn" id="mas" type="button">A+</button>
</header>
<div class="barra">
  <span id="resumen"></span>
  <label class="sr" for="buscar" id="buscarLbl"></label>
  <input id="buscar" type="search">
</div>
<div id="sinEscala"></div>
<div class="cuerpo">
  <nav id="nav"><ul id="navLista"></ul></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="sr" id="vivo" role="status" aria-live="polite"></div>

<script>/*QWEBCHANNEL*/</script>
<script>
"use strict";
let puente = null, E = null, vista = null, filtro = "", errores = {};
const abiertas = new Set();
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const h of hijos) if (h != null && h !== false) n.append(h);
  return n;
};
const fmt = (s, d) => s.replace(/\{(\w+)\}/g, (m, k) => (k in d ? d[k] : m));
const grados = (a) => { const r = Math.round(a * 100) / 100; return (Number.isInteger(r) ? r.toFixed(0) : String(r)) + "°"; };
const anunciar = (txt) => { if (!txt) return; $("vivo").textContent = ""; setTimeout(() => ($("vivo").textContent = txt), 30); };

function aplicarTema() {
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(E.tema)) if (typeof v === "string") r.setProperty("--" + k, v);
  r.setProperty("--fs", E.fuente + "px");
  document.documentElement.lang = E.idioma || "es";
  document.body.style.colorScheme = E.tema.oscuro ? "dark" : "light";
}

function coincide(r) {
  if (!filtro) return true;
  const t = (r.titulo + " " + r.grupo + " " + r.resumen + " " + r.detalle.texto_original + " " + r.id).toLowerCase();
  return filtro.split(/\s+/).every((p) => t.includes(p));
}

function pintar() {
  const T = E.t;
  aplicarTema();
  document.title = T.titulo;
  $("titulo").textContent = T.titulo;
  $("btnImportar").textContent = T.importar;
  $("btnExportar").textContent = T.exportar;
  for (const [id, k] of [["menos", "texto_menor"], ["mas", "texto_mayor"]]) { $(id).setAttribute("aria-label", T[k]); $(id).title = T[k]; }
  $("buscar").placeholder = T.buscar; $("buscarLbl").textContent = T.buscar;
  const R = E.resumen;
  $("resumen").replaceChildren(fmt(T.resumen, { a: R.activas, t: R.total }), " · ",
    el("b", { class: R.fuera ? "mal" : "", text: String(R.fuera) }), " " + T.fuera);
  $("resumen").title = T.nota;
  $("sinEscala").replaceChildren(...(E.sin_escala ? [el("p", { class: "aviso", role: "alert", text: T.sin_escala })] : []));

  if (!vista || (vista !== "_inc" && !E.categorias.some((c) => c.id === vista)))
    vista = E.categorias.length ? E.categorias[0].id : "_inc";
  const porId = Object.fromEntries(E.reglas.map((r) => [r.id, r]));
  const items = E.categorias.map((c) => {
    const malas = c.reglas.reduce((s, id) => s + (porId[id].activa ? porId[id].resultado.items.length : 0), 0);
    return navItem(c.id, c.nombre, malas ? String(malas) : String(c.reglas.length), malas > 0);
  });
  items.push(navItem("_inc", T.incumplimientos, String(E.incumplimientos.length), E.incumplimientos.length > 0));
  $("navLista").replaceChildren(...items);
  $("nav").setAttribute("aria-label", T.categorias);

  const main = $("main");
  if (vista === "_inc") {
    const lista = E.incumplimientos.length
      ? E.incumplimientos.map((i) => el("div", { class: "inc" }, el("span", { text: i.regla + " — " + i.texto }), botonPlano(i.i, i.texto)))
      : [el("p", { class: "vacio", text: "✓ " + T.sin_incumplimientos })];
    main.replaceChildren(el("h2", { text: T.incumplimientos }), ...lista);
    return;
  }
  const cat = E.categorias.find((c) => c.id === vista);
  const reglas = cat.reglas.map((id) => porId[id]).filter(coincide);
  const hijos = [el("h2", { text: cat.nombre })];
  let grupo = null;
  for (const r of reglas.sort((a, b) => a.grupo.localeCompare(b.grupo) || a.titulo.localeCompare(b.titulo))) {
    if (r.grupo !== grupo && cat.reglas.length > 6) { grupo = r.grupo; hijos.push(el("h3", { text: grupo })); }
    hijos.push(fila(r));
  }
  if (!reglas.length) hijos.push(el("p", { class: "vacio", text: T.sin_resultados }));
  main.replaceChildren(...hijos);
}

function navItem(id, nombre, num, mal) {
  return el("li", {}, el("button", { type: "button", "aria-current": String(vista === id),
    onclick: () => { vista = id; pintar(); $("main").focus(); } },
    el("span", { text: nombre }), el("span", { class: "num" + (mal ? " mal" : ""), text: num })));
}

function botonPlano(i, texto) {
  return i >= 0 ? el("button", { class: "btn", type: "button", onclick: () => puente.ir_a(i),
                                 "aria-label": E.t.ver_plano + ": " + texto }, E.t.ver_plano) : null;
}

function estadoChip(r) {
  const T = E.t, R = r.resultado;
  if (!r.activa) return el("span", { class: "chip gris", text: T.desactivada });
  if (R.pendiente) return el("span", { class: "chip gris", text: T.pendiente });
  if (!R.evaluados) return el("span", { class: "chip gris", text: T.nada });
  if (!R.items.length) return el("span", { class: "chip ok", text: fmt(T.cumple, { n: R.evaluados }), title: fmt(T.cumple_ayuda, { n: R.evaluados }) });
  return el("span", { class: "chip mal", text: fmt(T.incumple, { k: R.items.length, n: R.evaluados }) });
}

function fila(r) {
  const T = E.t, idT = "t_" + r.id, idD = "d_" + r.id, abierta = abiertas.has(r.id);
  const sw = el("button", { class: "switch", type: "button", role: "switch", "aria-checked": String(r.activa),
    "aria-label": T.activa + ": " + r.titulo, onclick: () => puente.activar(r.id, !r.activa, fin(r.id)) },
    el("span", { class: "pista", "aria-hidden": "true" }));
  const mas = el("button", { class: "mas", type: "button", "aria-expanded": String(abierta), "aria-controls": idD,
    "aria-label": T.detalles + ": " + r.titulo,
    onclick: () => { abierta ? abiertas.delete(r.id) : abiertas.add(r.id); pintar(); $("b_" + r.id)?.focus(); },
    id: "b_" + r.id }, abierta ? "▾ " + T.detalles : "▸ " + T.detalles);
  return el("div", { class: "fila" + (r.activa ? "" : " off") },
    el("div", { class: "linea" }, sw,
      el("span", { class: "tit", id: idT, text: r.titulo }),
      r.revisar ? el("span", { class: "chip rev", text: T.revisar, title: T.revisar_ayuda }) : null,
      el("span", { class: "val", text: r.resumen }), estadoChip(r), mas),
    abierta ? detalles(r, idD) : null);
}

function detalles(r, idD) {
  const T = E.t, D = r.detalle, R = r.resultado;
  const imp = "imp_" + r.id;
  const opt = (valor, texto) => el("label", {},
    (() => { const i = el("input", { type: "radio", name: imp, value: valor }); i.checked = (valor === "si") === r.obligatoria;
             i.addEventListener("change", () => cambiar(r.id, "obligatoria", valor === "si")); return i; })(),
    el("span", { text: texto }));
  const partes = [
    errores[r.id] ? el("p", { class: "err", role: "alert", text: errores[r.id] }) : null,
    r.descripcion ? el("p", { text: r.descripcion }) : null,
    D.texto_original ? el("p", {}, el("span", { class: "lbl", text: T.texto_original + ": " }), D.texto_original) : null,
    D.medido ? el("p", {}, el("span", { class: "lbl", text: T.medido + ": " }), D.medido) : null,
    D.referencias.length ? el("div", {}, el("span", { class: "lbl", text: T.referencias }),
                              el("ul", { class: "mut" }, ...D.referencias.map((x) => el("li", { text: x })))) : null,
    D.notas.length ? el("div", {}, el("span", { class: "lbl", text: T.notas }),
                        el("ul", { class: "mut" }, ...D.notas.map((x) => el("li", { text: x })))) : null,
    r.fuente ? el("p", { class: "mut", text: T.fuente + ": " + r.fuente }) : null,
    el("div", { class: "fila2" },
      el("fieldset", { class: "seg" }, el("legend", { class: "sr", text: T.importancia }), opt("si", T.obligatoria), opt("no", T.recomendada)),
      ...r.campos.filter((c) => c.tipo !== "grados_lista" && c.tipo !== "utilidades").map((c) => campoNum(r, c))),
    ...r.campos.filter((c) => c.tipo === "grados_lista" || c.tipo === "utilidades").map((c) => campo(r, c)),
    R.items.length ? el("div", {}, ...R.items.map((i) => el("div", { class: "inc" }, el("span", { text: i.texto }), botonPlano(i.i, i.texto)))) : null,
    el("div", { class: "fila2" },
      r.modificada ? el("button", { class: "btn", type: "button", onclick: () => puente.restablecer(r.id, fin(r.id)) }, T.restablecer) : null,
      !r.base ? el("button", { class: "btn peligro", type: "button", onclick: () => puente.quitar(r.id, fin(r.id)) }, T.quitar_regla) : null),
  ];
  return el("div", { class: "det", id: idD, role: "region", "aria-label": r.titulo }, ...partes);
}

function campoNum(r, c) {
  const id = `i_${r.id}_${c.clave}`;
  const inp = el("input", { type: "number", step: "any", min: c.min, max: c.max, id });
  inp.value = c.valor === null || c.valor === undefined ? "" : c.valor;
  inp.addEventListener("change", () => cambiar(r.id, c.clave, inp.value === "" && c.opcional ? null : parseFloat(inp.value)));
  return el("label", { for: id }, el("span", { class: "lbl", text: c.etiqueta + " " }), inp,
            " " + (c.tipo === "pies" ? E.t.pies : E.t.grados));
}

function campo(r, c) {
  const T = E.t;
  if (c.tipo === "grados_lista") {
    const vals = c.valor || [];
    const inp = el("input", { type: "number", step: "any", min: c.min, max: c.max, id: `n_${r.id}`, "aria-label": T.nuevo_angulo });
    const add = () => { const v = parseFloat(inp.value); if (!isNaN(v)) cambiar(r.id, c.clave, vals.concat([v])); };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
    return el("fieldset", {}, el("legend", { text: c.etiqueta }),
      el("ul", { class: "chips" }, ...vals.map((v) => el("li", {}, el("span", { text: grados(v) }),
        el("button", { type: "button", "aria-label": fmt(T.quitar, { v: grados(v) }), title: fmt(T.quitar, { v: grados(v) }),
                       onclick: () => cambiar(r.id, c.clave, vals.filter((x) => x !== v)) }, "×")))),
      el("div", { class: "fila2" }, inp, el("button", { class: "btn prim", type: "button", onclick: add }, T.agregar)));
  }
  const sel = new Set(c.valor || []);
  const opciones = E.utilidades.filter((u) => !c.opciones.length || c.opciones.includes(u.id));
  return el("fieldset", {}, el("legend", { text: c.etiqueta }),
    el("div", { class: "checks" }, ...opciones.map((u) => {
      const ch = el("input", { type: "checkbox", value: u.id }); ch.checked = sel.has(u.id);
      ch.addEventListener("change", () => cambiar(r.id, c.clave, opciones.map((x) => x.id).filter((id) => (id === u.id ? ch.checked : sel.has(id)))));
      return el("label", {}, ch, el("span", { text: u.nombre }));
    })));
}

function fin(id) {
  return (err) => {
    if (err) { errores[id] = err; anunciar(err); pintar(); } else { delete errores[id]; anunciar(E.t.guardado); }
  };
}
function cambiar(id, clave, valor) { puente.cambiar(id, clave, JSON.stringify(valor), fin(id)); }

function recibir(json) {
  const activo = document.activeElement && document.activeElement.id;
  E = JSON.parse(json);
  pintar();
  if (activo && $(activo)) $(activo).focus();          // no perder el foco al repintar
}

$("menos").addEventListener("click", () => { E.fuente = Math.max(13, E.fuente - 1); puente.fuente(E.fuente); aplicarTema(); });
$("mas").addEventListener("click", () => { E.fuente = Math.min(26, E.fuente + 1); puente.fuente(E.fuente); aplicarTema(); });
$("btnExportar").addEventListener("click", () => puente.exportar(anunciar));
$("btnImportar").addEventListener("click", () => puente.importar(anunciar));
$("buscar").addEventListener("input", (e) => { filtro = e.target.value.trim().toLowerCase(); pintar(); });

new QWebChannel(qt.webChannelTransport, (canal) => {
  puente = canal.objects.puente;
  puente.cambio.connect(recibir);
  puente.estado(recibir);
});
</script>
</body>
</html>
